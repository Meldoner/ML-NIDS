version: "3.9"

services:
  analyzer:
    build:
      context: ./analyzer
    container_name: nids-analyzer
    ports:
      - "8000:8000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=change_me_token
      - INFLUXDB_ORG=change_me_org
      - INFLUXDB_BUCKET=change_me_bucket
    depends_on:
      - influxdb

  influxdb:
    image: influxdb:2.7
    container_name: nids-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=change_me_password
      - DOCKER_INFLUXDB_INIT_ORG=change_me_org
      - DOCKER_INFLUXDB_INIT_BUCKET=change_me_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=change_me_token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:11.1.0
    container_name: nids-grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  influxdb_data:
  grafana_data:
